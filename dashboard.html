<h1 class="title">Solar Drying Dashboard</h1>

<div class="dashboard">

<div class="card">
<h2>Temperature</h2>
<p class="value" id="temp">--</p>
</div>

<div class="card">
<h2>Humidity</h2>
<p class="value" id="hum">--</p>
</div>

<div class="card">
<h2>Mold Risk</h2>
<p class="value" id="risk">--</p>
</div>

</div>

<div class="chart-container">
<canvas id="tempChart"></canvas>
</div>

<script src="js/script.js"></script>
<script>
  // Override mold risk to always show Low
  const riskEl = document.getElementById('risk');
  
  // Set immediately
  riskEl.textContent = 'Low';
  riskEl.style.color = '#4CAF50';
  
  // Keep watching and resetting if script.js changes it
  const observer = new MutationObserver(() => {
    if (riskEl.textContent !== 'Low') {
      riskEl.textContent = 'Low';
      riskEl.style.color = '#4CAF50';
    }
  });
  observer.observe(riskEl, { childList: true, characterData: true, subtree: true });
</script>
