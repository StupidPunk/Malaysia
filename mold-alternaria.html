<h1>Alternaria</h1>

<p>
Alternaria is a dark-colored mold commonly found on plants, soil, and indoor surfaces.
</p>

<p>
It is known to trigger allergic reactions and respiratory problems.
</p>

<h2>Prevention</h2>

<p>
• Reduce indoor humidity  
• Clean surfaces regularly  
• Improve ventilation
