<h1>Cladosporium</h1>

<p>
Cladosporium is one of the most common outdoor molds and can also grow indoors on damp surfaces.
</p>

<p>
It may cause allergies and asthma symptoms.
</p>

<h2>Prevention</h2>

<p>
• Control moisture  
• Clean damp areas  
• Use air filtration systems  
</p>
